<style>
/* Cowdrey.PDF: Cowdrey.MD's chrome (title + menus → ribbon → [sidebar | pages on a canvas] → status bar), for PDFs. */
:root {
  --chrome: #F8F6F6; --surface: #FFFFFF; --canvas: #ECE8E9; --ink: #221B1E; --ink-2: #5E5559; --ink-3: #685F63;

  --font-ui: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --chrome: #1A1719; --surface: #221E21; --canvas: #110F10; --ink: #EDE7E9; --ink-2: #B0A6AA; --ink-3: #A0969A;
  --line: #342D31; --hover: #2C2629; --press: #3A2F34; --accent: #F0889F; --accent-ink: #2B0512; --brand: #AE1747; --brand-hover: #C21E53; --accent-soft: #42202C;
  --danger: #FF8A80; --page-shadow: 0 0 0 1px #342D31, 0 10px 30px rgba(0,0,0,.45); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --chrome: #1A1719; --surface: #221E21; --canvas: #110F10; --ink: #EDE7E9; --ink-2: #B0A6AA; --ink-3: #A0969A;
  --line: #342D31; --hover: #2C2629; --press: #3A2F34; --accent: #F0889F; --accent-ink: #2B0512; --brand: #AE1747; --brand-hover: #C21E53; --accent-soft: #42202C;
  --danger: #FF8A80; --page-shadow: 0 0 0 1px #342D31, 0 10px 30px rgba(0,0,0,.45); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--chrome); color: var(--ink); font: 14px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
.ic, [data-lucide] { width: 18px; height: 18px; flex: none; stroke-width: 1.75; }
.app { display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; height: 100dvh; }
.app > *, .workspace > * { min-width: 0; } /* a wide ribbon scrolls; it never widens the window */

/* title bar and menus */
.titlebar { display: flex; align-items: center; gap: 12px; padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px)); }
.logo { width: 32px; height: 32px; border-radius: 8px; flex: none; display: block; }
.tb-main { min-width: 0; flex: 1; }
.tb-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.doc-title { font-size: 18px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save-state { color: var(--ink-3); font-size: 13px; white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.menubar { display: flex; gap: 2px; margin-left: -6px; }
.menubar > button { border: 0; background: none; padding: 2px 6px; border-radius: 5px; color: var(--ink); cursor: default; font-size: 14px; }
.menubar > button:hover, .menubar > button[aria-expanded="true"] { background: var(--hover); }
.menubar > button:focus-visible { outline-offset: -2px; }
.tb-actions { display: flex; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--brand); color: #FFFFFF; border-color: transparent; }
.btn.primary:hover { background: var(--brand-hover); }
.btn.danger { background: var(--danger); color: var(--accent-ink); border-color: transparent; }
.icon-btn { border: 0; background: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.btn:disabled, .btn:disabled:hover { opacity: .45; cursor: default; background: var(--surface); }
.btn.primary:disabled, .btn.primary:disabled:hover { background: var(--brand); }
.more-btn { display: none; }

/* ribbon */
.ribbon { border-bottom: 1px solid var(--line); }
.ribbon-tabs { display: flex; gap: 4px; padding: 0 max(16px, env(safe-area-inset-left, 0px)); overflow-x: auto; scrollbar-width: none; }
.ribbon-tabs::-webkit-scrollbar { display: none; }
.ribbon-tabs button { flex: none; }
.ribbon-tabs button { border: 0; background: none; padding: 5px 10px 6px; color: var(--ink-2); font-weight: 500; cursor: pointer; position: relative; }

.ribbon-tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 2px; background: var(--accent); }
/* One height on every tab: labels take two lines at most and buttons never shrink; a wide tab scrolls, with a fade

.ribbon-body { display: flex; align-items: stretch; gap: 0; padding: 4px max(12px, env(safe-area-inset-left, 0px)) 3px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; height: 76px; }

.ribbon-body.more-l.more-r { -webkit-mask-image: linear-gradient(90deg, transparent, #000 48px, #000 calc(100% - 48px), transparent); mask-image: linear-gradient(90deg, transparent, #000 48px, #000 calc(100% - 48px), transparent); }
.ribbon-tabs.more-r { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); }
.r-group { display: flex; flex-direction: column; align-items: center; padding: 0 10px; border-right: 1px solid var(--line); flex: none; }
.r-group[hidden] { display: none; }
.r-group:last-child { border-right: 0; }
.r-items { display: flex; gap: 2px; align-items: center; flex: 1; }
.r-label { font-size: 11px; line-height: 1.3; color: var(--ink-3); margin-top: 1px; white-space: nowrap; }
.rb { border: 0; background: none; border-radius: 6px; padding: 3px 6px; display: inline-flex; flex-direction: column; align-items: center; justify-content: flex-start; align-self: stretch; gap: 2px; min-width: 52px; max-width: 92px; flex: none; cursor: pointer; color: var(--ink); font-size: 12px; }
.rb > span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: center; line-height: 1.15; overflow-wrap: normal; }
.rb:focus-visible, .ribbon-tabs button:focus-visible, .side-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rb:hover { background: var(--hover); }
.rb[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.rb:disabled { opacity: .4; cursor: default; background: none; }
.swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }

/* workspace */
.workspace { display: grid; grid-template-columns: 240px 1fr; min-height: 0; }
.app[data-sidebar="off"] .workspace { grid-template-columns: 0 1fr; }
.app[data-sidebar="off"] .sidebar { visibility: hidden; }
.sidebar { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.side-top { display: flex; align-items: center; }
.side-top .side-tabs { flex: 1; min-width: 0; }
.side-close { display: none; }
.side-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 10px; padding: 3px; border-radius: 9px; background: var(--hover); }
.side-tabs button { border: 0; background: none; border-radius: 7px; padding: 5px 4px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.side-tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
:root[data-theme="dark"] .side-tabs button[aria-selected="true"] { background: var(--press); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .side-tabs button[aria-selected="true"] { background: var(--press); } }
.side-panel { flex: 1; overflow: auto; padding: 0 10px 16px; }
.thumbs { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 4px; }

.thumb canvas { display: block; box-shadow: var(--page-shadow); background: #fff; max-width: 150px; }
.thumb[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.thumb.drag-over { outline: 2px dashed var(--accent); }
.outline-list, .doc-list { list-style: none; margin: 0; padding: 0; }
.outline-list button, .doc-list button.doc-open { border: 0; background: none; width: 100%; text-align: left; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.outline-list button:hover, .doc-list button.doc-open:hover { background: var(--hover); }
.doc-item { display: flex; align-items: center; }
.doc-item .m { display: block; font-size: 11px; color: var(--ink-3); }
.doc-item[aria-current="true"] .doc-open { background: var(--accent-soft); }
.empty-note { color: var(--ink-3); font-size: 13px; padding: 8px; }

/* pages */
.viewer { position: relative; overflow: auto; background: var(--canvas); min-width: 0; }
.pages { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 16px 64px; }
.page { position: relative; background: #fff; box-shadow: var(--page-shadow); flex: none; --scale-round-x: 1px; --scale-round-y: 1px; color-scheme: light; }
.page canvas.pdf { position: absolute; inset: 0; width: 100%; height: 100%; }
.app[data-darkpage="on"] .page canvas.pdf { filter: invert(.92) hue-rotate(180deg); }
.textLayer { z-index: 2; }
.page .annotationLayer { --annotation-unfocused-field-background: url("data:image/svg+xml;charset=UTF-8,<svg width='1px' height='1px' xmlns='http://www.w3.org/2000/svg'><rect width='100%' height='100%' style='fill:rgba(174, 23, 71, 0.08);'/></svg>"); --input-focus-border-color: #AE1747; }
.page .annotationLayer input[type="checkbox"], .page .annotationLayer input[type="radio"] { accent-color: #8E1238; }
.textLayer ::selection { background: rgba(174, 23, 71, .28); color: transparent; }
.annotationLayer { z-index: 3; }
.annotationLayer :is(input:not([type="checkbox"]):not([type="radio"]), textarea, select) { background: rgba(174, 23, 71, .07); color: #111; }
.marks { position: absolute; inset: 0; z-index: 4; overflow: visible; pointer-events: none; }
.app[data-tool]:not([data-tool="select"]):not([data-tool="highlight"]) .marks { pointer-events: auto; cursor: crosshair; }
.app[data-tool="text"] .marks, .app[data-tool="note"] .marks { cursor: text; }
.marks .mk { pointer-events: auto; cursor: pointer; }
.app[data-tool="select"] .marks .mk:hover { filter: drop-shadow(0 0 2px var(--accent)); }
.marks .mk.sel { filter: drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 1px var(--accent)); }
.marks text { user-select: none; }
.app[data-tool="edit"] .marks { cursor: default; }
.app[data-tool="erase"] .marks { cursor: crosshair; }
.marks .content-hover { fill: color-mix(in srgb, var(--accent) 8%, transparent); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 2; pointer-events: none; }
.marks .content-sel { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 3; pointer-events: none; }
.marks .content-handle { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; cursor: nwse-resize; }
.line-editor { position: absolute; z-index: 6; padding: 0 1px; margin: 0 -1px; white-space: pre; outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 1px; caret-color: currentColor; cursor: text; box-shadow: 0 4px 18px rgba(0,0,0,.18); }
.find-hit { position: absolute; background: rgba(255, 200, 0, .45); z-index: 1; pointer-events: none; border-radius: 2px; }
.find-hit.now { background: rgba(255, 120, 0, .6); }
.drop[hidden] { display: none; }
.drop { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-2); padding: 24px; }
.drop .card { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.drop h2 { margin: 0; font-size: 22px; color: var(--ink); letter-spacing: -.01em; }
.drop p { margin: 0; }
.btn.link { background: none; border-color: transparent; color: var(--accent); }
.btn.link:hover { text-decoration: underline; background: none; }
.app[data-dragging="on"] .viewer { outline: 3px dashed var(--accent); outline-offset: -8px; }

/* status bar */
.statusbar { display: flex; align-items: center; gap: 16px; padding: 4px max(16px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); color: var(--ink-3); font-size: 13px; }
.sb-spacer { flex: 1; }
.sb-brand { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-brand a { color: inherit; }
.sb-zoom { display: flex; align-items: center; gap: 6px; }
.sb-zoom input[type="range"] { width: 110px; accent-color: var(--accent); }
.sb-zoom .icon-btn { width: 28px; height: 28px; }
#zoomLabel { height: 26px; padding: 0 10px; }
.page-jump { width: 44px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; color: var(--ink); font: inherit; padding: 1px 2px; }

/* popovers, dialogs, toast */
.popover { position: fixed; z-index: 50; min-width: 220px; overflow-y: auto; overscroll-behavior: contain; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.18); padding: 6px; }
.popover[hidden] { display: none; }
.mi { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; width: 100%; border: 0; background: none; padding: 5px 8px; border-radius: 6px; text-align: left; cursor: pointer; color: var(--ink); }
.mi:hover, .mi:focus-visible { background: var(--hover); outline: none; }
.mi:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.mh { font-size: 11px; font-weight: 600; color: var(--ink-3); padding: 6px 8px 2px; }
.mi:disabled { opacity: .45; cursor: default; background: none; }
.mi .k { color: var(--ink-3); font-size: 12px; }
.msep { height: 1px; background: var(--line); margin: 5px 6px; }

dialog[open] { display: flex; flex-direction: column; max-height: calc(100dvh - 24px); }
dialog > .dlg-head, dialog > .dlg-foot { flex: none; }
dialog > .dlg-body { flex: 1 1 auto; min-height: 0; overflow: auto; }

@media (prefers-reduced-transparency: reduce) { dialog::backdrop { backdrop-filter: none; background: rgba(18, 12, 15, .55); } }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 6px; }
.dlg-head h2 { margin: 0; font-size: 17px; }
.dlg-body { padding: 6px 18px 4px; color: var(--ink-2); }

.field { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
.field input, .field textarea { font: inherit; color: var(--ink); background: var(--chrome); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.sig-pad { width: 100%; height: 160px; border: 1px dashed var(--line); border-radius: 10px; background: #fff; touch-action: none; display: block; }

.about .logo { width: 64px; height: 64px; border-radius: 15px; font-size: 22px; }

.findbar { position: absolute; top: 10px; right: 16px; z-index: 20; display: flex; gap: 6px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }

.findbar input { font: inherit; color: var(--ink); background: var(--chrome); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 200px; }

@media (max-width: 760px) {

<div class="app" id="app" data-sidebar="on" data-tool="select">
  <header class="titlebar">
    <img class="logo" src="__APP_ICON__" alt="" aria-hidden="true">
    <div class="tb-main">
      <div class="tb-row"><span class="doc-title" id="docTitle">Cowdrey.PDF</span><span class="save-state" id="saveState"></span></div>
      <nav class="menubar" id="menubar" aria-label="Menus"></nav>
    </div>
    <div class="tb-actions">
      <button class="icon-btn" id="themeBtn" type="button" title="Theme" aria-label="Theme"><i data-lucide="sun-moon"></i></button>
      <button class="btn" type="button" data-cmd="open" aria-label="Open"><i data-lucide="folder-open"></i><span>Open</span></button>
      <button class="btn primary" type="button" data-cmd="save" id="saveBtn" aria-label="Save PDF"><i data-lucide="download"></i><span>Save PDF</span></button>
      <button class="icon-btn more-btn" id="moreBtn" type="button" title="More" aria-label="More" aria-haspopup="menu" aria-expanded="false"><i data-lucide="ellipsis"></i></button>
    </div>
  </header>
  <div class="ribbon">
    <div class="ribbon-tabs" role="tablist" aria-label="Ribbon" id="ribbonTabs"></div>
    <div class="ribbon-body" id="ribbonBody" role="tabpanel"></div>
  </div>
  <div class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <div class="side-top">
        <div class="side-tabs" role="tablist" aria-label="Sidebar">
          <button type="button" role="tab" data-side="thumbs" aria-selected="true" aria-controls="sidePanel">Pages</button>
          <button type="button" role="tab" data-side="outline" aria-selected="false" aria-controls="sidePanel">Outline</button>
          <button type="button" role="tab" data-side="docs" aria-selected="false" aria-controls="sidePanel">Documents</button>
        </div>
        <button class="icon-btn side-close" id="sideClose" type="button" title="Close sidebar" aria-label="Close sidebar"><i data-lucide="x"></i></button>
      </div>
      <div class="side-panel" id="sidePanel" role="tabpanel"></div>
    </aside>
    <main class="viewer" id="viewer" tabindex="-1">
      <div class="findbar" id="findbar" hidden>
