name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04 # Playwright 1.56 supports this Ubuntu; ubuntu-latest moved to 26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # One step, every line logged, so the tests-log branch shows exactly where a run stopped.
      - name: Install, build and test
        run: |
          set -o pipefail
          L="$RUNNER_TEMP/tests.log"
          {
            echo "== install the app's libraries"; (cd desktop && npm ci)
            echo "== install Playwright and Chromium"; npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
            echo "== check index.html is built from src/"; python3 build.py && git diff --exit-code --stat index.html
            echo "== make the sample PDF"; node tests/sample.mjs
            echo "== run the tests"; node tests/e2e.mjs
            echo "== open a PDF in the copy the apps ship"; (cd desktop && node build.mjs) && node tests/bundle.mjs
          } 2>&1 | tee "$L"

      # The result goes on the tests-log branch, so it can be read without signing in to GitHub.
      - name: Publish the result
        if: always() && github.event_name != 'pull_request'
        run: |
          D=$(mktemp -d); cd "$D" && git init -q -b tests-log
          [[ -f "$RUNNER_TEMP/tests.log" ]] && tail -c 200000 "$RUNNER_TEMP/tests.log" > tests.log
          echo "${{ job.status }} · run ${{ github.run_number }} · ${{ github.sha }}" > status.txt
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Test results, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tests-log
