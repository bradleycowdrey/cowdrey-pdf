name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04 # Playwright 1.56 supports this Ubuntu; ubuntu-latest moved to 26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # One step, every line logged, so the tests-log branch shows exactly where a run stopped.
      - name: Install, build and test
        run: |
          set -o pipefail
          L="$RUNNER_TEMP/tests.log"
          {
            echo "== install the app's libraries"; (cd desktop && npm ci)
            echo "== install Playwright and Chromium"; npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
            echo "== check index.html is built from src/"; python3 build.py && git diff --exit-code --stat index.html
            echo "== check docs/app-store/listing.md is made from listing.json"; python3 .github/scripts/app_store_listing_md.py --check
            echo "== make the sample PDF"; node tests/sample.mjs
            echo "== run the tests"; node tests/e2e.mjs
            echo "== open a PDF in the copy the apps ship"; (cd desktop && node build.mjs) && node tests/bundle.mjs
          } 2>&1 | tee "$L"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # PDF/A and PDF/X (package 3): makes the input files, exports each through the app, validates every PDF/A output
      # with veraPDF (from Maven Central, checksum pinned) and every PDF/X output with tests/conformance/pdfx_check.py.
      - name: PDF/A and PDF/X conformance
        run: |
          set -o pipefail
          L="$RUNNER_TEMP/tests.log"
          {
            echo "== PDF/A and PDF/X conformance (tests/conformance/pkg3.mjs)"
            # In a virtual environment of its own: pkg3 runs its helpers with python3 -I, which skips the user site
            # where a plain pip install lands on the runner (run 28: No module named 'fontTools').
            python3 -m venv "$RUNNER_TEMP/py3" && export PATH="$RUNNER_TEMP/py3/bin:$PATH"
            pip install --quiet fonttools==4.68.0 pillow==12.3.0 pikepdf==10.18.2
            J=tests/conformance/.cache/verapdf-cli-1.30.4.jar; mkdir -p tests/conformance/.cache
            curl -fsSL -o "$J" https://repo1.maven.org/maven2/org/verapdf/apps/cli/1.30.4/cli-1.30.4.jar
            echo "f00c4d2a18dd3af7e9450bc9ac6688726fc4acf1a9d97d52e3e992021e84f93e  $J" | sha256sum -c -
            VERAPDF="$J" node tests/conformance/pkg3.mjs
          } 2>&1 | tee -a "$L"

      # Package 4 acceptance: certificate signing, timestamps, revocation, checked by the app and by pdfsig, pyHanko and
      # openssl, against a local timestamp server, OCSP responder and CRLs (tests/conformance/pkg4.mjs).
      - name: Signing acceptance (package 4)
        run: |
          set -o pipefail
          sudo apt-get install -y poppler-utils
          python3 -m venv "$RUNNER_TEMP/py" && "$RUNNER_TEMP/py/bin/pip" install -q pyhanko
          PATH="$RUNNER_TEMP/py/bin:$PATH" node tests/conformance/pkg4.mjs 2>&1 | tee -a "$RUNNER_TEMP/tests.log"

      # The result goes on the tests-log branch, so it can be read without signing in to GitHub.
      - name: Publish the result
        if: always() && github.event_name != 'pull_request'
        run: |
          D=$(mktemp -d); cd "$D" && git init -q -b tests-log
          [[ -f "$RUNNER_TEMP/tests.log" ]] && tail -c 200000 "$RUNNER_TEMP/tests.log" > tests.log
          echo "${{ job.status }} · run ${{ github.run_number }} · ${{ github.sha }}" > status.txt
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Test results, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tests-log
