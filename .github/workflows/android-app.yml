name: Android app

on:
  push:
    branches: [main]
    # Build a new Android version when the web app, the Rust code, the version number or this workflow changes.
    paths:
      - src/**
      - index.html
      - build.py
      - desktop/build.mjs
      - desktop/package.json
      - desktop/package-lock.json
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/Cargo.toml
      - desktop/src-tauri/src/**
      - desktop/src-tauri/capabilities/**
      - desktop/src-tauri/plugins/**
      - tests/android/**
      - .github/workflows/android-app.yml
      - .github/scripts/android_e2e.sh
  workflow_dispatch:
    inputs:
      quick:
        description: Only build the test app and run the device test (no release APK or App Bundle)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android:
    name: Build Cowdrey.PDF for Android and try it on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 200
    outputs:
      test_apk: ${{ steps.testapk.outputs.built }}
    env:
      # Upload key for Google Play (base64 .jks or .keystore), its password and alias. Without them the APK is
      # signed with a throwaway key: fine for trying it, but each build then needs uninstalling the last one.
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install build tools and libraries
        working-directory: desktop
        run: npm ci

      - name: Bundle the web app for offline use
        working-directory: desktop
        run: node build.mjs

      - name: Create the Android project
        working-directory: desktop
        run: |
          set -o pipefail
          npx tauri android init --ci 2>&1 | tee -a "$RUNNER_TEMP/android-build.log"
          # Glyph inside the adaptive-icon safe zone, so round and squircle launchers don't crop it.
          npx tauri icon src-tauri/icons/android-source.png 2>&1 | tail -3 | tee -a "$RUNNER_TEMP/android-build.log"
          # Themed (monochrome) layer for Android 13+ launchers, added to the adaptive icon tauri just wrote.
          RES=src-tauri/gen/android/app/src/main/res
          if [ -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" ] && ! grep -q monochrome "$RES/mipmap-anydpi-v26/ic_launcher.xml"; then
            mkdir -p "$RES/drawable-nodpi" && cp src-tauri/icons/android-monochrome.png "$RES/drawable-nodpi/ic_launcher_monochrome.png"
            sed -i 's|</adaptive-icon>|  <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>\n</adaptive-icon>|' "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          fi

      # Phones (arm64, older armv7) and the x86_64 emulator used below.
      - name: Build the APK and App Bundle
        if: ${{ !inputs.quick }}
        working-directory: desktop
        run: |
          set -o pipefail
          npx tauri android build --apk --aab --ci --target aarch64 --target armv7 --target x86_64 2>&1 | tee -a "$RUNNER_TEMP/android-build.log"

      - name: Show which files Android will offer to open with Cowdrey.PDF
        working-directory: desktop
        run: |
          M=$(find src-tauri/gen/android -name AndroidManifest.xml -path '*src/main*' | head -1)
          { echo "Intent filters in $M:"; grep -A6 '<intent-filter' "$M"; } | tee -a "$RUNNER_TEMP/android-build.log"
          { echo "SDK levels:"; grep -rhoE '(minSdk|targetSdk|compileSdk)[^,)]*' src-tauri/gen/android/app/build.gradle.kts src-tauri/gen/android/buildSrc 2>/dev/null | sort -u; } | tee -a "$RUNNER_TEMP/android-build.log"
          { echo "Permissions:"; grep -h 'uses-permission' "$M"; } | tee -a "$RUNNER_TEMP/android-build.log"
          # Cleartext http stays off in the release app; revocation checks speak plain http on their own (docs/android.md).
          { echo "Cleartext traffic:"; grep -o 'usesCleartextTraffic="[^"]*"' "$M"; grep -h 'usesCleartextTraffic' src-tauri/gen/android/app/build.gradle.kts | sed 's/^ *//'; } | tee -a "$RUNNER_TEMP/android-build.log"

      - name: Sign the APK
        if: ${{ !inputs.quick }}
        run: |
          set -eo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=$(find desktop/src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          AAB=$(find desktop/src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          echo "APK: $UNSIGNED · AAB: $AAB" | tee -a "$RUNNER_TEMP/android-build.log"
          if [[ -n "$KEYSTORE" ]]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"; PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; SIGNED_BY="upload key"
          else
            PASS=$(openssl rand -hex 16); ALIAS=test; SIGNED_BY="throwaway test key"
            keytool -genkeypair -keystore "$RUNNER_TEMP/upload.jks" -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Cowdrey.PDF test build" > /dev/null 2>&1
          fi
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out "$RUNNER_TEMP/Cowdrey.PDF.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/Cowdrey.PDF.apk" && echo "APK signed with the $SIGNED_BY" | tee -a "$RUNNER_TEMP/android-build.log"
          if [[ -n "$KEYSTORE" ]]; then
            cp "$AAB" "$RUNNER_TEMP/Cowdrey.PDF.aab"
            jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$PASS" "$RUNNER_TEMP/Cowdrey.PDF.aab" "$ALIAS" > /dev/null && echo "App Bundle signed for Google Play" | tee -a "$RUNNER_TEMP/android-build.log"
          fi
          rm -f "$RUNNER_TEMP/upload.jks"

      # With the upload key, the APK goes on the version's GitHub release as Cowdrey.PDF.apk, so
      # github.com/…/releases/latest/download/Cowdrey.PDF.apk (linked from bradcowdrey.com) is always the newest.
      # The Mac workflow creates that release; wait for it, and create it only if it never appears.
      # Only from main, and only with the upload key: test builds from other branches are never published.
      - name: Publish the APK on the GitHub release
        if: ${{ !inputs.quick && github.ref == 'refs/heads/main' && env.KEYSTORE != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          for i in $(seq 1 60); do gh release view "v$V" > /dev/null 2>&1 && break; echo "waiting for release v$V"; sleep 60; done
          gh release view "v$V" > /dev/null 2>&1 || gh release create "v$V" --title "Cowdrey.PDF v$V" --notes "Cowdrey.PDF $V by Bradley Cowdrey (https://bradcowdrey.com)."
          gh release upload "v$V" "$RUNNER_TEMP/Cowdrey.PDF.apk" --clobber
          echo "Published Cowdrey.PDF.apk on release v$V" | tee -a "$RUNNER_TEMP/android-build.log"

      # A separate debug build for the device test only: same app, with its web view open to the test driver (Chrome
      # DevTools protocol) and its files readable with run-as. It is never signed for release, uploaded or published.
      - name: Build the test app (debug, x86_64, for the emulator only)
        id: testapk
        working-directory: desktop
        run: |
          set -o pipefail
          npx tauri android build --debug --apk --ci --target x86_64 2>&1 | tail -40 | tee -a "$RUNNER_TEMP/android-build.log"
          T=$(find src-tauri/gen/android/app/build/outputs/apk -name '*debug*.apk' | head -1)
          echo "Test APK: $T" | tee -a "$RUNNER_TEMP/android-build.log"
          cp "$T" "$RUNNER_TEMP/Cowdrey.PDF-test.apk"
          echo "built=yes" >> "$GITHUB_OUTPUT"

      # The release build leaves Gradle and Kotlin daemons and gigabytes of build files behind; on full runs the
      # emulator then came up without any network (runs 21 and 22; quick runs 20 and 23 had one). The APKs are
      # already copied out, so the daemons are stopped and Gradle's build files removed before the emulator starts.
      - name: Make room for the emulator
        run: |
          echo "before:"; free -m | sed -n 2p; df -h / | tail -1
          (cd desktop/src-tauri/gen/android && ./gradlew --stop > /dev/null 2>&1) || true
          pkill -f 'GradleDaemon|KotlinCompileDaemon|kotlin-daemon' || true
          rm -rf desktop/src-tauri/gen/android/app/build desktop/src-tauri/gen/android/.gradle
          echo "after:"; free -m | sed -n 2p; df -h / | tail -1

      - name: Install the device test driver
        run: |
          mkdir -p "$RUNNER_TEMP/driver" && cd "$RUNNER_TEMP/driver" && npm init -y > /dev/null
          npm install --no-save --no-audit --no-fund playwright-core@1.56.1 > /dev/null && echo "playwright-core installed"

      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          # The DNS servers the runner itself uses (behind systemd-resolved's 127.0.0.53, which the emulator can't reach)
          D=$(resolvectl dns 2>/dev/null | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | grep -v '^127\.' | sort -u | head -2 | paste -sd, -)
          echo "EMU_DNS=${D:+$D,}8.8.8.8" >> "$GITHUB_ENV"; echo "emulator DNS: ${D:+$D,}8.8.8.8"

      # The release APK opens a PDF, has a field typed into and saves it (tests/android/release.mjs); then the test
      # build runs every scenario in tests/android/run.mjs on the emulator's own web view, and saves screenshots and
      # the files it saved.
      - name: Test it on an Android 15 emulator
        timeout-minutes: 130
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PW_CORE: ${{ runner.temp }}/driver/node_modules/playwright-core
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          # The runner's own DNS (systemd-resolved on 127.0.0.53) can't be reached from inside the emulator, which then
          # has no names at all (runs 18 and 19: net::ERR_NAME_NOT_RESOLVED everywhere): it is given the real servers.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server ${{ env.EMU_DNS }}
          script: bash .github/scripts/android_e2e.sh "$RUNNER_TEMP/Cowdrey.PDF.apk" "$RUNNER_TEMP/Cowdrey.PDF-test.apk" "$RUNNER_TEMP/smoke" 2>&1 | tee -a "$RUNNER_TEMP/android-build.log"

      - name: Check the device test passed
        run: |
          cat "$RUNNER_TEMP/smoke/result.txt" 2>/dev/null || { echo "The device test did not finish"; exit 1; }
          if [[ "${{ inputs.quick }}" != "true" ]]; then
            cat "$RUNNER_TEMP/smoke/release-result.txt" 2>/dev/null || { echo "The release APK test did not run"; exit 1; }
            grep -q '^RELEASE PASSED' "$RUNNER_TEMP/smoke/release-result.txt" || { echo "The release APK test failed"; exit 1; }
          fi
          grep -q '^ALL PASSED' "$RUNNER_TEMP/smoke/result.txt"

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.quick }}
        with:
          name: Cowdrey.PDF-Android
          path: |
            ${{ runner.temp }}/Cowdrey.PDF.apk
            ${{ runner.temp }}/Cowdrey.PDF.aab
          if-no-files-found: ignore

      # The test build, the build log and what the device test saved: kept with the run only, never on a release.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cowdrey.PDF-Android-test
          path: |
            ${{ runner.temp }}/Cowdrey.PDF-test.apk
            ${{ runner.temp }}/android-build.log
            ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14

  # The same test build on a second phone: a newer Android (16) with a newer web view, and only 2 GB of memory, as
  # on low-cost phones. It runs the everyday scenarios and a 50-page OCR (tests/android/run.mjs, LOWRAM).
  android-second:
    name: Try it on a second phone (Android 16, 2 GB)
    needs: android
    if: ${{ !cancelled() && needs.android.outputs.test_apk == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install the libraries the device test checks files with
        working-directory: desktop
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: Cowdrey.PDF-Android-test
          path: ${{ runner.temp }}/main

      - name: Install the device test driver
        run: |
          mkdir -p "$RUNNER_TEMP/driver" && cd "$RUNNER_TEMP/driver" && npm init -y > /dev/null
          npm install --no-save --no-audit --no-fund playwright-core@1.56.1 > /dev/null && echo "playwright-core installed"

      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          D=$(resolvectl dns 2>/dev/null | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | grep -v '^127\.' | sort -u | head -2 | paste -sd, -)
          echo "EMU_DNS=${D:+$D,}8.8.8.8" >> "$GITHUB_ENV"; echo "emulator DNS: ${D:+$D,}8.8.8.8"

      - name: Test it on an Android 16 emulator with 2 GB of memory
        timeout-minutes: 100
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PW_CORE: ${{ runner.temp }}/driver/node_modules/playwright-core
          LOWRAM: '1'
          ONLY: "open with: a VIEW|own worker|mark up with a finger|^Save PDF|^Save again|^Edit PDF|^forms: (tap|Save PDF)|^large file|HEIC|OCR with no network|50-page|phone layout|^memory|light mode"
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 2048M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -dns-server ${{ env.EMU_DNS }}
          script: bash .github/scripts/android_e2e.sh none "$RUNNER_TEMP/main/Cowdrey.PDF-test.apk" "$RUNNER_TEMP/smoke" 2>&1 | tee "$RUNNER_TEMP/android-second.log"

      - name: Check the device test passed
        run: |
          cat "$RUNNER_TEMP/smoke/result.txt" 2>/dev/null || { echo "The device test did not finish"; exit 1; }
          grep -q '^ALL PASSED' "$RUNNER_TEMP/smoke/result.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cowdrey.PDF-Android-second-test
          path: |
            ${{ runner.temp }}/android-second.log
            ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14

  # The logs and emulator screenshots of this run go on the android-build-log branch, readable without signing in:
  # the first phone (Android 15, 4 GB) at the top, the second (Android 16, 2 GB) in second-phone/. The branch is made
  # new each time, so it only ever holds this run's files; screenshots.txt lists them.
  log:
    name: Publish the build log and screenshots
    needs: [android, android-second]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Cowdrey.PDF-Android-test
          path: ${{ runner.temp }}/main
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Cowdrey.PDF-Android-second-test
          path: ${{ runner.temp }}/second
      - name: Push the android-build-log branch
        run: |
          D=$(mktemp -d); cd "$D" && git init -q -b android-build-log
          [[ -f "$RUNNER_TEMP/main/android-build.log" ]] && tail -c 300000 "$RUNNER_TEMP/main/android-build.log" > android-build.log
          cp "$RUNNER_TEMP"/main/smoke/*.png "$RUNNER_TEMP"/main/smoke/*.txt . 2>/dev/null
          if [[ -d "$RUNNER_TEMP/second/smoke" ]]; then
            mkdir -p second-phone
            [[ -f "$RUNNER_TEMP/second/android-second.log" ]] && tail -c 300000 "$RUNNER_TEMP/second/android-second.log" > second-phone/android-test.log
            cp "$RUNNER_TEMP"/second/smoke/*.png "$RUNNER_TEMP"/second/smoke/*.txt second-phone/ 2>/dev/null
          fi
          # Only the screenshots this run's test log names, so no picture can pass for one of this run's by mistake.
          for dir in . second-phone; do
            [[ -d "$dir" ]] || continue
            for f in "$dir"/*.png; do
              [[ -e "$f" ]] || continue
              grep -qF "screenshot $(basename "$f")" "$dir/e2e-log.txt" 2>/dev/null || { echo "not in this run's log, left out: $f"; rm -f "$f"; }
            done
          done
          {
            echo "Run ${{ github.run_number }} (${{ github.run_id }}) · branch ${{ github.ref_name }} · ${{ github.sha }}"
            echo "First phone (Android 15, 4 GB): ${{ needs.android.result }} · files at the top"
            echo "Second phone (Android 16, 2 GB): ${{ needs.android-second.result }} · files in second-phone/"
            echo
            echo "Screenshots of this run, in the order they were taken:"
            ls -1 *.png 2>/dev/null | sed 's/^/  /'
            if [[ -d second-phone ]]; then ls -1 second-phone/*.png 2>/dev/null | sed 's/^/  /'; fi
          } > screenshots.txt
          R="${{ needs.android.result }}"
          if [[ "$R" == "success" && "${{ needs.android-second.result }}" != "success" ]]; then R="${{ needs.android-second.result }}"; fi
          echo "$R · run ${{ github.run_number }} (${{ github.run_id }}) · branch ${{ github.ref_name }} · ${{ github.sha }}" > status.txt
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Android build log, run ${{ github.run_number }}"
          # (github.com can be out of reach for a minute: run 29's push failed after every test had passed)
          for i in 1 2 3 4; do
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-build-log && exit 0
            echo "push failed, trying again in $((i * 30)) s"; sleep $((i * 30))
          done
          exit 1
