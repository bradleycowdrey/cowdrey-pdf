[package]
name = "cowdrey-pdf"
version = "1.1.0"
description = "Cowdrey.PDF, a PDF viewer and editor by Bradley Cowdrey"
authors = ["Bradley Cowdrey"]
license = "MIT"
repository = "https://github.com/bradleycowdrey/cowdrey-pdf"
edition = "2021"

# The Mac app runs main.rs; the iPhone and iPad app loads the same code from this library.
[lib]
name = "cowdrey_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Timestamps for certificate signatures (src/tsa.rs): one https POST of a fingerprint, only when the person asks for
# one. The same reqwest and rustls as the updater uses; on Android with the phone's own certificate authorities.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# In-place updates and relaunching are for the Mac app only; the App Store updates the iPhone app.
# Android saves and opens files through the system picker's content:// addresses, read and written by this plugin.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "2"

# Native features on iPhone, iPad and Android (plugins/sharekit, adapted from tauri-plugin-sharekit 0.3.1): the share
# sheet, printing and PDF, files edited in place, and the sync folder. On the Mac, only its share menu is used.
[target.'cfg(any(target_os = "ios", target_os = "android", target_os = "macos"))'.dependencies]
tauri-plugin-sharekit = { path = "plugins/sharekit" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

# The Mac App Store build only: security-scoped bookmarks, so a sandboxed app can reopen and save back to the
# files a person opened in an earlier session (see src/bookmarks.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = ["NSURL", "NSData", "NSError", "NSString", "NSArray"] }

[features]
# The Developer ID (DMG) build updates itself from GitHub releases: that is the default, used by mac-app.yml.
default = ["updater"]
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
# The Mac App Store build (mac-app-store.yml): built with --no-default-features --features app-store, so it has
# no self-updater (the App Store updates it), runs in the App Sandbox and keeps file access through bookmarks.
app-store = ["dep:objc2", "dep:objc2-foundation"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
